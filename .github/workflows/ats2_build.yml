name: ATS2 MSYS2

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-gc

      # Cache
      - name: Cache ATS2 Binaries
        id: cache-ats2
        uses: actions/cache@v4
        with:
          path: /opt/ats2
          key: ${{ runner.os }}-ats2-v0.4.2

      - name: Install ATS2 (only if not cached)
        if: steps.cache-ats2.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/tmp
          curl -L http://a166.pp.ua/ATS2-Postiats-int-0.4.2.tgz -o ats2.tar.gz
          tar -xzf ats2.tar.gz --strip-components=1 -C /opt/tmp
          cd /opt/tmp
          ./configure --prefix=/opt/ats2
          make all
          make install

      # Environment
      - name: Set ATS2 Environment
        run: |
          echo "PATSHOME=/opt/ats2" >> $GITHUB_ENV
          echo "/opt/ats2/bin" >> $GITHUB_PATH

      - name: Verify Installation
        run: |
          ldd /opt/ats2/lib/ats2-postiats-0.4.2/bin/patscc
          patscc

      - name: Build My Project
        run: |
          patscc -o ats_app.exe main.dats

      # Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-ats-binary
          path: my_ats_app.exe
          if-no-files-found: error
